<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧翻譯官</title>
    <style>
        /* 基礎設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: clamp(15px, 4vw, 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主容器 */
        .main-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 標頭 */
        header {
            text-align: center;
            margin-bottom: clamp(25px, 5vw, 40px);
            padding: clamp(15px, 3vw, 25px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            color: white;
            width: 100%;
        }

        header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            opacity: 0.9;
            font-style: italic;
        }

        /* 表單區域 */
        .form-box {
            background: white;
            padding: clamp(20px, 5vw, 35px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin-bottom: 30px;
        }

        /* 表單樣式 */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3748;
            font-size: clamp(0.95rem, 3vw, 1.1rem);
        }

        input[type="text"] {
            width: 100%;
            padding: clamp(12px, 3vw, 15px);
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: clamp(0.95rem, 3vw, 1.05rem);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* 答案框特別樣式 */
        #answer {
            background-color: #f8fafc;
            border-color: #cbd5e0;
            min-height: 60px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            color: #4a5568;
        }

        /* 按鈕區 */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        input[type="submit"],
        input[type="button"] {
            flex: 1;
            padding: clamp(12px, 3vw, 16px);
            border: none;
            border-radius: 10px;
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        input[type="submit"]:hover {
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        input[type="button"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        input[type="button"]:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .main-container {
                padding: 10px;
            }
            
            .form-box {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
                gap: 12px;
            }
            
            input[type="submit"],
            input[type="button"] {
                width: 100%;
                padding: 14px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 15px;
                margin-bottom: 20px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .form-box {
                padding: 15px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            input[type="text"] {
                padding: 12px;
                font-size: 1rem;
            }
        }

        /* 動畫效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-box {
            animation: fadeIn 0.5s ease-out;
        }

        /* 載入狀態（可選） */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>智慧翻譯官</h1>
            <p class="subtitle">感性優雅的文字轉譯，讀懂你字裡行間的心意</p>
        </header>
        
        <section>
            <div class="form-box">
                <form action="/ask" method="post">
                    <div class="form-group">
                        <label for="question">請輸入你想翻譯的文字：</label>
                        <input type="text" id="question" name="question" 
                               value="{{ question }}" 
                               placeholder="輸入中文或英文..."
                               autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="answer">翻譯結果：</label>
                        <input type="text" id="answer" name="answer" 
                               readonly 
                               value="{{ answer }}"
                               placeholder="翻譯結果將顯示在這裡...">
                    </div>
                    
                    <div class="button-group">
                        <input type="submit" value="開始翻譯">
                        <input type="button" value="返回首頁" onclick="window.location.href='/'">
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script>
        // 簡單的載入狀態（可選）
        document.querySelector('form').addEventListener('submit', function() {
            if (document.querySelector('#question').value.trim()) {
                this.classList.add('loading');
                document.querySelector('input[type="submit"]').value = '翻譯中...';
            }
        });
        
        // 自動聚焦到輸入框
        window.onload = function() {
            if (!"{{ question }}") {
                document.getElementById('question').focus();
            }
        };
    </script>
</body>
</html>
