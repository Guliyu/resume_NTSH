<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧翻譯官</title>
    <style>
        /* 所有 CSS 保持不變 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: clamp(15px, 4vw, 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ... (所有 CSS 樣式保持不變，只是複製過來) ... */

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>智慧翻譯官</h1>
            <p class="subtitle">感性優雅的文字轉譯，讀懂你字裡行間的心意</p>
        </header>
        
        <section>
            <div class="form-box">
                <form id="translation-form" action="/ask" method="post">
                    <div class="form-group">
                        <label for="question">請輸入你想翻譯的文字：</label>
                        <div class="input-container">
                            <textarea id="question" name="question" 
                                      rows="4"
                                      placeholder="輸入中文或英文..."></textarea>
                            <div class="char-count" id="question-count">0/1000</div>
                        </div>
                    </div>
                    
                    <!-- 載入動畫 -->
                    <div class="loading-spinner" id="loading-spinner"></div>
                    
                    <!-- 翻譯結果區域 -->
                    <div id="result-container" class="form-group" style="display: none;">
                        <label for="answer">翻譯結果：</label>
                        <div class="result-container">
                            <textarea id="answer" name="answer" 
                                      rows="6"
                                      readonly
                                      placeholder="翻譯結果將顯示在這裡..."></textarea>
                            <div class="char-count" id="answer-count">0/2000</div>
                        </div>
                        
                        <!-- 額外的翻譯結果顯示區域 -->
                        <div id="translation-result" class="translation-result" style="display: none;">
                            <div class="result-header">
                                <div class="result-title">翻譯結果</div>
                                <button type="button" class="copy-btn" id="copy-btn">
                                    <i class="far fa-copy"></i> 複製結果
                                </button>
                            </div>
                            <div class="result-content" id="result-content"></div>
                        </div>
                    </div>
                    
                    <div class="button-group">
                        <input type="submit" value="開始翻譯" id="submit-btn">
                        <input type="button" value="返回首頁" onclick="window.location.href='/'">
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script>
        // DOM 元素
        const questionInput = document.getElementById('question');
        const answerInput = document.getElementById('answer');
        const questionCount = document.getElementById('question-count');
        const answerCount = document.getElementById('answer-count');
        const translationForm = document.getElementById('translation-form');
        const loadingSpinner = document.getElementById('loading-spinner');
        const submitBtn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');
        const translationResult = document.getElementById('translation-result');
        const resultContent = document.getElementById('result-content');
        const copyBtn = document.getElementById('copy-btn');
        
        // 模擬翻譯結果（長文本示例）
        const longTranslationExample = `智慧翻譯官不僅僅是一個簡單的文字轉換工具，它是一個能夠理解語境、捕捉情感、傳達文化內涵的智能助手。當您輸入一段文字時，我們的系統會分析其深層含義，考慮上下文關係，並結合文化背景知識，提供最自然、最準確的翻譯結果。
        
我們採用了先進的神經機器翻譯技術，結合深度學習算法，能夠處理各種複雜的語言結構。無論是文學作品中的詩意表達，還是專業文獻中的術語翻譯，智慧翻譯官都能勝任。

主要特點：
• 上下文感知翻譯
• 多語言支持
• 文化敏感度調整
• 行業術語精準翻譯
• 即時翻譯結果
• 可自訂翻譯風格

使用智慧翻譯官，您獲得的將不僅僅是字面上的翻譯，而是真正傳達原意的優美表達。`;

        // 初始化字數統計
        updateCharCount(questionInput, questionCount, 1000);
        updateCharCount(answerInput, answerCount, 2000);
        
        // 自動調整文本區域高度
        autoResizeTextarea(questionInput);
        autoResizeTextarea(answerInput);
        
        // 字數統計函數
        function updateCharCount(textarea, countElement, maxLength) {
            const length = textarea.value.length;
            countElement.textContent = `${length}/${maxLength}`;
            
            // 如果接近或超過最大長度，改變顏色
            if (length > maxLength * 0.9) {
                countElement.style.color = length > maxLength ? '#e53e3e' : '#d69e2e';
            } else {
                countElement.style.color = '#718096';
            }
        }
        
        // 自動調整文本區域高度
        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(textarea.scrollHeight, 400);
            textarea.style.height = newHeight + 'px';
        }
        
        // 事件監聽器
        questionInput.addEventListener('input', function() {
            updateCharCount(this, questionCount, 1000);
            autoResizeTextarea(this);
        });
        
        answerInput.addEventListener('input', function() {
            updateCharCount(this, answerCount, 2000);
            autoResizeTextarea(this);
        });
        
        // 表單提交處理
        translationForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const question = questionInput.value.trim();
            if (!question) {
                alert('請輸入要翻譯的文字！');
                questionInput.focus();
                return;
            }
            
            // 顯示載入狀態
            submitBtn.value = '翻譯中...';
            submitBtn.classList.add('loading');
            loadingSpinner.style.display = 'block';
            resultContainer.style.display = 'none';
            translationResult.style.display = 'none';
            
            // 模擬API呼叫延遲
            setTimeout(() => {
                // 這裡應該是實際的API呼叫
                // 為了演示，我們使用模擬數據
                const mockAnswer = longTranslationExample;
                
                // 更新答案
                answerInput.value = mockAnswer;
                resultContent.textContent = mockAnswer;
                
                // 更新字數統計
                updateCharCount(answerInput, answerCount, 2000);
                autoResizeTextarea(answerInput);
                
                // 顯示結果區域
                resultContainer.style.display = 'block';
                translationResult.style.display = 'block';
                
                // 恢復按鈕狀態
                submitBtn.value = '開始翻譯';
                submitBtn.classList.remove('loading');
                loadingSpinner.style.display = 'none';
                
                // 滾動到結果區域
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1500);
        });
        
        // 複製結果功能
        copyBtn.addEventListener('click', function() {
            const textToCopy = answerInput.value || resultContent.textContent;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                // 顯示成功訊息
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已複製！';
                copyBtn.style.background = '#38a169';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.style.background = '';
                }, 2000);
            }).catch(err => {
                console.error('複製失敗: ', err);
                alert('複製失敗，請手動選取並複製文字');
            });
        });
        
        // 自動聚焦到輸入框
        window.onload = function() {
            questionInput.focus();
        };
        
        // 視窗大小改變時重新調整文本區域
        window.addEventListener('resize', function() {
            autoResizeTextarea(questionInput);
            autoResizeTextarea(answerInput);
        });
    </script>
    
    <!-- Font Awesome 圖示庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
