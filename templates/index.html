<!DOCTYPE html>
<html>
<head>
    <title>自我介紹</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* 1. 基礎設定：營造一個平靜的閱讀氛圍 */
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom right, #e0f2f1 0%, #ffebee 100%); 
        font-family: 'Helvetica Neue', Arial, sans-serif;
        color: #333;
        margin: 0;
        padding: 20px 15px; /* 手機上減少上下邊距 */
        box-sizing: border-box;
    }

    /* 主容器 */
    .main-container {
        width: 100%;
        max-width: 800px;
        text-align: center;
    }

    /* 2. 主標題：響應式設計 */
    h1 {
        color: #2c3e50; 
        font-size: clamp(1.8rem, 4vw, 2.4rem); /* 響應式字體大小 */
        font-weight: 700;
        background-color: #e6f7ff; 
        padding: clamp(15px, 3vw, 20px) clamp(15px, 4vw, 25px); /* 響應式內距 */
        border-radius: 8px;
        margin-bottom: clamp(30px, 5vw, 50px); /* 響應式邊距 */
        text-align: center;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); 
        width: 100%; 
        box-sizing: border-box;
        word-break: keep-all; /* 防止文字斷行 */
    }

    /* 3. 列表容器 */
    .nav-list {
        list-style: none; 
        padding: 0;
        margin: clamp(30px, 5vw, 50px) auto 0 auto; /* 響應式邊距 */
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px; /* 使用 gap 替代 margin-bottom */
    }

    /* 4. 列表項目 */
    .nav-list li {
        width: 100%;
    }

    /* 5. 連結（按鈕）：響應式設計 */
    .nav-list a {
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(14px, 3vw, 18px) clamp(10px, 3vw, 25px);
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
        color: white;
        font-weight: bold;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        width: 100%;
        box-sizing: border-box;
        
        /* 響應式字體大小 */
        font-size: clamp(0.9rem, 3vw, 1rem);
        text-align: center;
        min-height: 50px; /* 確保按鈕有最小高度 */
        
        /* 防止文字斷行，確保按鈕內文字單行顯示 */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 6. 懸停效果 */
    .nav-list a:hover {
        background: linear-gradient(135deg, #1c88e5 0%, #00e5f2 100%); 
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    /* 7. 觸控設備優化 */
    @media (hover: none) {
        .nav-list a:active {
            background: linear-gradient(135deg, #1c88e5 0%, #00e5f2 100%); 
            transform: translateY(-1px);
        }
    }

    /* 8. 手機專用調整 */
    @media (max-width: 480px) {
        body {
            padding: 15px 10px;
            justify-content: flex-start; /* 手機上從頂部開始 */
            padding-top: 40px;
        }
        
        .nav-list {
            gap: 10px;
        }
        
        .nav-list a {
            white-space: normal; /* 手機上允許文字換行 */
            min-height: 44px; /* 符合觸控最佳實踐 */
            padding: 12px 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        h1 {
            font-size: 1.5rem;
            padding: 15px;
            margin-bottom: 30px;
        }
    }

    /* 9. 平板調整 */
    @media (min-width: 481px) and (max-width: 768px) {
        .nav-list a {
            font-size: 1rem;
            padding: 15px 20px;
        }
        
        h1 {
            font-size: 2rem;
        }
    }

    /* 10. 電腦大螢幕優化 */
    @media (min-width: 1200px) {
        .main-container {
            max-width: 900px;
        }
        
        .nav-list {
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
    }
</style>
</head>
    
<body>
    <div class="main-container">
    <h1>新北高中30815林韋溱</h1>
    
    <ul class="nav-list"> 
        <li><a href="/competition">競賽經驗</a></li>
        <li><a href="/activities">課外活動</a></li>
        <li><a href="/leadership">幹部經驗</a></li>
        <li><a href="/club">社團經驗</a></li>
        <li><a href="/electives">多元選修課程</a></li>
        <li><a href="/ai">AI應用</a></li>
        <li><a href="/ask">中英翻譯</a></li>
    </ul>
    </div>
</body>
</html>
